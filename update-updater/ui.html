<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';img-src 'self' data:;object-src 'none';base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChronoCord Updater</title><style>*{box-sizing:border-box}body{margin:0;background:#090812;color:#fff;font-family:Segoe UI,Arial,sans-serif}.wrap{padding:28px}.logo{width:74px;height:74px;border-radius:22px;margin:auto;background:radial-gradient(circle at 50% 50%,#000 0 22%,transparent 23%),conic-gradient(from 20deg,#4b00a8,#b026ff,#5b00d6,#1b003f,#4b00a8);box-shadow:0 0 40px #8d2cff77;position:relative}.logo:after{content:"";position:absolute;inset:15px;border-radius:50%;border:5px solid #b026ff88;transform:rotate(-18deg) scaleX(1.25)}h1{text-align:center;margin:20px 0 6px;font-size:24px}p{text-align:center;color:#aaa8bc;line-height:1.5}.card{margin-top:22px;padding:18px;border:1px solid #30264a;background:#11101c;border-radius:16px}.version{font-size:22px;font-weight:800;color:#c18cff}.notes{white-space:pre-wrap;color:#b9b5c9;font-size:13px;max-height:180px;overflow:auto;margin-top:12px}.buttons{display:flex;gap:10px;margin-top:20px}.buttons button{flex:1;padding:13px;border-radius:11px;border:1px solid #3b3157;background:#211b2f;color:#fff;font-weight:700}.buttons .primary{background:linear-gradient(135deg,#8d2cff,#5d24d9);border:0}.progress{height:8px;background:#211c2e;border-radius:8px;overflow:hidden;margin-top:18px}.bar{height:100%;width:0;background:linear-gradient(90deg,#6b1dff,#c65aff)}.status{text-align:center;font-size:12px;color:#9f9aac;margin-top:10px}.mandatory{background:#431b28;border:1px solid #7e3048;border-radius:10px;padding:10px;color:#ff9aae;font-size:12px;margin-top:12px}</style></head><body><div class="wrap"><div class="logo"></div><h1>Atualização disponível</h1><p>Uma nova versão do ChronoCord está pronta.</p><div class="card"><div class="version" id="version">—</div><div id="title"></div><div class="notes" id="notes"></div><div id="mandatory"></div><div class="buttons"><button id="later">Depois</button><button class="primary" id="update">Atualizar agora</button></div><div class="progress"><div class="bar" id="bar"></div></div><div class="status" id="status">Preparando…</div></div></div><script>const $=id=>document.getElementById(id);window.updaterAPI.onEvent(e=>{if(e.type==='available'){$('version').textContent='ChronoCord '+e.version;$('title').textContent=e.title;$('notes').textContent=e.notes||'Correções e melhorias.';$('mandatory').innerHTML=e.mandatory?'<div class="mandatory">Esta atualização é obrigatória.</div>':'';$('later').style.display=e.mandatory?'none':'';$('status').textContent='Pronto para atualizar.'}if(e.type==='state'){$('status').textContent=e.text||'';$('bar').style.width=(e.progress||0)+'%';if(e.step==='done'){$('update').disabled=true;$('later').disabled=true}}if(e.type==='error')$('status').textContent=e.text});$('update').onclick=async()=>{ $('update').disabled=true;$('later').disabled=true;await window.updaterAPI.update()};$('later').onclick=()=>window.updaterAPI.later();</script></body></html>
