<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';img-src 'self' data:;object-src 'none';base-uri 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChronoCord</title>
  <style>
    *{box-sizing:border-box}
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#f7f4ff;background:transparent}
    body{margin:0;background:transparent;overflow:hidden}
    .window{width:100vw;height:100vh;padding:1px;border-radius:22px;background:linear-gradient(145deg,rgba(160,110,255,.85),rgba(69,45,110,.78));box-shadow:0 28px 80px rgba(0,0,0,.55),0 0 50px rgba(133,77,255,.2)}
    .surface{width:100%;height:100%;border-radius:21px;background:radial-gradient(circle at 15% 0%,rgba(133,78,255,.18),transparent 42%),linear-gradient(160deg,#17132a,#0d0b15);overflow:hidden;display:flex;flex-direction:column}
    .titlebar{height:42px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.07);-webkit-app-region:drag}
    .brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;letter-spacing:.1px}
    .brand-logo{width:23px;height:23px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(170,91,255,.5))}
    .content{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:22px 26px 24px;text-align:center}
    .orb{width:62px;height:62px;border-radius:20px;margin-bottom:14px;background:radial-gradient(circle at 32% 28%,#d3a6ff 0 6%,transparent 7%),linear-gradient(135deg,#9d49ff,#5e2fe4);box-shadow:0 0 28px rgba(157,73,255,.33);display:grid;place-items:center;animation:pulse 2.4s ease-in-out infinite}
    .orb::after{content:"";width:25px;height:25px;border-radius:50%;border:3px solid rgba(255,255,255,.45);transform:rotate(-18deg) scaleX(1.2)}
    h1{font-size:18px;margin:0 0 6px;font-weight:800}
    .message{min-height:18px;color:#bdb6ce;font-size:12px;line-height:1.45}
    .progress{width:100%;height:9px;margin-top:19px;background:#29233c;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
    .bar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#7137ff,#b65aff,#8d45ff);box-shadow:0 0 14px rgba(143,68,255,.55);transition:width .25s ease}
    .percent{margin-top:9px;color:#8f88a5;font-size:10px;min-height:12px}
    @keyframes pulse{0%,100%{transform:translateY(0);box-shadow:0 0 28px rgba(157,73,255,.33)}50%{transform:translateY(-2px);box-shadow:0 0 36px rgba(157,73,255,.48)}}
  </style>
</head>
<body>
  <div class="window">
    <div class="surface">
      <div class="titlebar">
        <div class="brand"><img class="brand-logo" src="branding/chronocord-logo.svg" alt=""><span>ChronoCord</span></div>
      </div>
      <main class="content">
        <div class="orb" aria-hidden="true"></div>
        <h1>Atualizando o ChronoCord</h1>
        <div class="message" id="status">Preparando atualização…</div>
        <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>
        <div class="percent" id="percent"></div>
      </main>
    </div>
  </div>
  <script>
    const $=id=>document.getElementById(id);
    window.updaterAPI.onEvent(e=>{
      if(e.type==='state'){
        $('status').textContent=e.text||'Atualizando o ChronoCord…';
        if(Number.isFinite(e.progress)){
          const p=Math.max(0,Math.min(100,Number(e.progress)||0));
          $('bar').style.width=p+'%';
          $('percent').textContent=p>0?p+'%':'';
        }
      }
      if(e.type==='error'){
        $('status').textContent='Não foi possível concluir a atualização.';
        $('bar').style.width='100%';
        $('bar').style.background='linear-gradient(90deg,#9f355b,#e05f7d)';
        $('percent').textContent='';
      }
    });
  </script>
</body>
</html>
