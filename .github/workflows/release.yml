name: ChronoCord Release

on:
  push:
    tags:
      - 'chronocord-v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --include=optional
      - name: Validate source
        run: npm run check
      - name: Verify package version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^chronocord-v',''
          $pkg = node -p "require('./package.json').version"
          if ($tag -ne $pkg) { throw "Tag $tag não corresponde ao package.json $pkg" }
      - name: Build installer
        run: npm run dist
        env:
          CI: true
      - name: Generate SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter 'ChronoCord-Setup-*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'ChronoCord installer was not generated.' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$($exe.FullName).sha256" -Value "$hash  $($exe.Name)" -NoNewline
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ChronoCord-Setup-*.exe
            release/ChronoCord-Setup-*.exe.sha256
          generate_release_notes: true
          prerelease: false
          name: ChronoCord ${{ github.ref_name }}
          body: |
            Release automática do ChronoCord.

            O instalador foi compilado e validado pelo pipeline antes da publicação.
