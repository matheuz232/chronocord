name: ChronoCord Release

on:
  push:
    branches:
      - 'development/1.0.3-stability'
    tags:
      - 'chronocord-v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=optional

      - name: Core script syntax preflight
        shell: pwsh
        run: |
          $files = @(
            'preflight.mjs',
            'build-preflight.mjs',
            'scripts-build.mjs',
            'update-updater/main.cjs',
            'server/server.js',
            'electron/main.cjs',
            'electron/preload.cjs'
          )
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "Sintaxe inválida: $file" }
          }

      - name: Validate source
        run: npm run check

      - name: Build installer
        run: npm run dist
        env:
          CI: true

      - name: Verify installer output
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter 'ChronoCord-Setup-*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'ChronoCord installer was not generated.' }
          if ($exe.Length -lt 1MB) { throw "Installer unexpectedly small: $($exe.Length) bytes" }
          Write-Host "Installer: $($exe.FullName)"
          Write-Host "Size: $($exe.Length) bytes"

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter 'ChronoCord-Setup-*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'ChronoCord installer was not generated.' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$($exe.FullName).sha256" -Value "$hash  $($exe.Name)" -NoNewline

      - name: Upload test installer artifact
        if: startsWith(github.ref, 'refs/heads/development/1.0.3-stability')
        uses: actions/upload-artifact@v4
        with:
          name: ChronoCord-1.0.3-windows-test
          path: |
            release/ChronoCord-Setup-*.exe
            release/ChronoCord-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/chronocord-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ChronoCord-Setup-*.exe
            release/ChronoCord-Setup-*.exe.sha256
          generate_release_notes: true
          prerelease: false
          name: ChronoCord ${{ github.ref_name }}
          body: |
            Release automática do ChronoCord.

            O instalador foi compilado e validado pelo pipeline antes da publicação.

# Triggered by ChronoCord build hardening.
