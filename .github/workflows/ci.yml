name: ChronoCord CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'development/**'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --include=optional
      - name: Validate source
        run: npm run check
      - name: Build renderer
        run: npm run build
