name: ChronoCord Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integration/1.0.3-final
    tags:
      - 'v*'

concurrency:
  group: chronocord-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true

jobs:
  windows-build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Settings — account API
        run: node --test tests/settings-account-api.test.mjs

      - name: Settings — account local-only
        run: node --test tests/settings-account-local-only.test.mjs

      - name: Settings — catalog
        run: node --test tests/settings-catalog.test.mjs

      - name: Settings — media priority
        run: node --test tests/settings-media-priority.test.mjs

      - name: Settings — packaging
        run: node --test tests/settings-packaging.test.mjs

      - name: Settings — product transform
        run: node --test tests/settings-product-transform.test.mjs

      - name: Settings — profile page
        run: node --test tests/settings-profile-page.test.mjs

      - name: Settings — profile summary
        run: node --test tests/settings-profile-summary.test.mjs

      - name: Settings — profile transform
        run: node --test tests/settings-profile-transform.test.mjs

      - name: Settings — screen share
        run: node --test tests/settings-screen-share.test.mjs

      - name: Settings — server/local contract
        run: node --test tests/settings-server-backed.test.mjs

      - name: Settings — storage
        run: node --test tests/settings-storage.test.mjs

      - name: Settings — transform
        run: node --test tests/settings-transform.test.mjs

      - name: Settings — updater
        run: node --test tests/settings-updater.test.mjs

      - name: Settings — voice stage
        run: node --test tests/settings-voice-stage.test.mjs

      - name: Distribution architecture
        run: node --test tests/windows-distribution.test.mjs

      - name: Install dependencies
        run: npm install --include=optional

      - name: Dependency security audit
        run: npm audit --audit-level=low

      - name: Core syntax preflight
        shell: pwsh
        run: |
          $files = @(
            'preflight.mjs',
            'build-preflight.mjs',
            'scripts-build.mjs',
            'scripts-installer-bootstrapper.mjs',
            'update-updater/main.cjs',
            'installer-bootstrapper/main.cjs',
            'installer-bootstrapper/preload.cjs',
            'server/server.js',
            'electron/main.cjs',
            'electron/preload.cjs'
          )
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "Sintaxe inválida: $file" }
          }

      - name: Project preflight
        run: node preflight.mjs

      - name: Build preflight
        run: node build-preflight.mjs

      - name: Build installers
        run: npm run dist

      - name: Verify installers
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $setup = Get-Item "release/ChronoCord-Setup-$version.exe" -ErrorAction Stop
          $installer = Get-Item "release/ChronoCord-Installer-$version.exe" -ErrorAction Stop
          if ($setup.Length -lt 1MB) { throw "Setup unexpectedly small: $($setup.Length) bytes" }
          if ($installer.Length -lt 1MB) { throw "Animated installer unexpectedly small: $($installer.Length) bytes" }
          Write-Host "Setup: $($setup.Name) — $($setup.Length) bytes"
          Write-Host "Installer: $($installer.Name) — $($installer.Length) bytes"

      - name: Smoke-test NSIS payload
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $setup = (Resolve-Path "release/ChronoCord-Setup-$version.exe").Path
          $target = Join-Path $env:RUNNER_TEMP 'ChronoCord-Smoke'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $proc = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "NSIS smoke install failed with exit code $($proc.ExitCode)" }
          $installed = Join-Path $target 'ChronoCord.exe'
          if (-not (Test-Path $installed)) { throw "Installed executable not found at $installed" }
          if ((Get-Item $installed).Length -lt 1MB) { throw 'Installed ChronoCord.exe is unexpectedly small.' }
          Write-Host "NSIS smoke install OK: $installed"

      - name: Smoke-test animated bootstrapper
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = (Resolve-Path "release/ChronoCord-Installer-$version.exe").Path
          $proc = Start-Process -FilePath $installer -ArgumentList '--smoke-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Animated installer smoke-test failed with exit code $($proc.ExitCode)" }
          Write-Host 'Animated installer smoke-test OK.'

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File | Where-Object { $_.Name -match '^ChronoCord-(Setup|Installer)-.*\.exe$' }
          if ($files.Count -lt 2) { throw 'Expected both Setup and Installer executables.' }
          foreach ($exe in $files) {
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($exe.Name)" | Out-File "$($exe.FullName).sha256" -Encoding ascii -NoNewline
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ChronoCord-Windows-${{ github.sha }}
          path: |
            release/ChronoCord-Installer-*.exe
            release/ChronoCord-Installer-*.exe.sha256
            release/ChronoCord-Setup-*.exe
            release/ChronoCord-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ChronoCord ${{ github.ref_name }}
          body_path: RELEASE-1.0.3.md
          files: |
            release/ChronoCord-Installer-*.exe
            release/ChronoCord-Installer-*.exe.sha256
            release/ChronoCord-Setup-*.exe
            release/ChronoCord-Setup-*.exe.sha256
          fail_on_unmatched_files: true
