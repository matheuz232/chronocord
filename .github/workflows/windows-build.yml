name: ChronoCord Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integration/1.0.3-final
    tags:
      - 'v*'

concurrency:
  group: chronocord-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true

jobs:
  windows-build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Settings — account API
        run: node --test tests/settings-account-api.test.mjs

      - name: Settings — account local-only
        run: node --test tests/settings-account-local-only.test.mjs

      - name: Settings — catalog
        run: node --test tests/settings-catalog.test.mjs

      - name: Settings — media priority
        run: node --test tests/settings-media-priority.test.mjs

      - name: Settings — packaging
        run: node --test tests/settings-packaging.test.mjs

      - name: Settings — product transform
        run: node --test tests/settings-product-transform.test.mjs

      - name: Settings — profile page
        run: node --test tests/settings-profile-page.test.mjs

      - name: Settings — profile summary
        run: node --test tests/settings-profile-summary.test.mjs

      - name: Settings — profile transform
        run: node --test tests/settings-profile-transform.test.mjs

      - name: Settings — screen share
        run: node --test tests/settings-screen-share.test.mjs

      - name: Settings — server/local contract
        run: node --test tests/settings-server-backed.test.mjs

      - name: Settings — storage
        run: node --test tests/settings-storage.test.mjs

      - name: Settings — transform
        run: node --test tests/settings-transform.test.mjs

      - name: Settings — updater
        run: node --test tests/settings-updater.test.mjs

      - name: Settings — native installer
        run: node --test tests/settings-installer-native.test.mjs

      - name: Settings — voice stage
        run: node --test tests/settings-voice-stage.test.mjs

      - name: Distribution architecture
        run: node --test tests/windows-distribution.test.mjs

      - name: Install dependencies
        run: npm install --include=optional

      - name: Dependency security audit
        run: npm audit --audit-level=low

      - name: Core syntax preflight
        shell: pwsh
        run: |
          $files = @(
            'preflight.mjs',
            'build-preflight.mjs',
            'scripts-build.mjs',
            'scripts-installer-bootstrapper.mjs',
            'server/server.js',
            'electron/main.cjs',
            'electron/preload.cjs'
          )
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "Sintaxe inválida: $file" }
          }

      - name: Project preflight
        run: node preflight.mjs

      - name: Build preflight
        run: node build-preflight.mjs

      - name: Build installer
        run: npm run dist

      - name: Smoke-test native updater
        shell: pwsh
        run: |
          $updater = Get-Item "build/updater/ChronoCordUpdater.exe" -ErrorAction Stop
          if ($updater.Length -gt 2MB) { throw "Native updater unexpectedly large: $($updater.Length) bytes" }
          $proc = Start-Process -FilePath $updater.FullName -ArgumentList '--smoke-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Native updater smoke-test failed with exit code $($proc.ExitCode)" }
          Write-Host "Native updater: $($updater.Length) bytes"

      - name: Verify one final installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-Item "release/ChronoCord-Installer-$version.exe" -ErrorAction Stop
          if ($installer.Length -lt 1MB) { throw "Installer unexpectedly small: $($installer.Length) bytes" }
          if ($installer.Length -gt 285000000) { throw "Installer exceeds 285 MB hard limit: $($installer.Length) bytes" }
          if (Test-Path "release/ChronoCord-Setup-$version.exe") { throw 'Internal Setup leaked into final artifacts.' }
          $primary = @(Get-ChildItem release -File | Where-Object { $_.Name -match '^ChronoCord-(Setup|Installer)-.*\.exe$' })
          if ($primary.Count -ne 1) { throw "Expected exactly one primary installer, found $($primary.Count)." }
          Write-Host "Installer: $($installer.Name) — $($installer.Length) bytes"

      - name: Smoke-test embedded payload
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = (Resolve-Path "release/ChronoCord-Installer-$version.exe").Path
          $proc = Start-Process -FilePath $installer -ArgumentList '--smoke-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer payload smoke-test failed with exit code $($proc.ExitCode)" }
          Write-Host 'Embedded payload SHA-256 smoke-test OK.'

      - name: Smoke-test silent installation
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = (Resolve-Path "release/ChronoCord-Installer-$version.exe").Path
          $target = Join-Path $env:RUNNER_TEMP 'ChronoCord-Smoke'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $proc = Start-Process -FilePath $installer -ArgumentList @('--silent', "--dir=$target") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Final installer smoke install failed with exit code $($proc.ExitCode)" }
          $installed = Join-Path $target 'ChronoCord.exe'
          if (-not (Test-Path $installed)) { throw "Installed executable not found at $installed" }
          if ((Get-Item $installed).Length -lt 1MB) { throw 'Installed ChronoCord.exe is unexpectedly small.' }
          Write-Host "Final installer smoke install OK: $installed"

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-Item "release/ChronoCord-Installer-$version.exe" -ErrorAction Stop
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File "$($installer.FullName).sha256" -Encoding ascii -NoNewline
          Write-Host "SHA-256: $hash"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ChronoCord-Windows-${{ github.sha }}
          path: |
            release/ChronoCord-Installer-*.exe
            release/ChronoCord-Installer-*.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ChronoCord ${{ github.ref_name }}
          body_path: RELEASE-1.0.3.md
          files: |
            release/ChronoCord-Installer-*.exe
            release/ChronoCord-Installer-*.exe.sha256
          fail_on_unmatched_files: true
